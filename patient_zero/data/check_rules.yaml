# Rules for `pz check`: mistakes that show up again and again in AI-built health apps.
# Everything here is a heuristic over source text. A hit is a lead, not a verdict,
# and no hit is not a pass. To add a rule, add an entry and a test that shows it firing.
#
# files:    code | config | any       which files the pattern is tried on
# pattern:  a regular expression tried on each line (case-insensitive unless case: true)
# control:  the profile control the mistake speaks to
# title / why / fix: plain language, written for someone who is not a security engineer

line_rules:
  - id: browser-model-key
    files: any
    case: true
    pattern: '\b(?:NEXT_PUBLIC|VITE|REACT_APP|EXPO_PUBLIC|PUBLIC|NUXT_PUBLIC|GATSBY)_[A-Z0-9_]*(?:SECRET|SERVICE_ROLE|PRIVATE_KEY|OPENAI|ANTHROPIC|GEMINI|GROQ|MISTRAL|COHERE|OPENROUTER)[A-Z0-9_]*'
    severity: critical
    control: BASE-2
    title: A model or admin key is exposed to every visitor's browser
    why: Variables with this prefix are built into the page that every visitor downloads. Anyone can copy the key and use it as you.
    fix: Rename the variable without the public prefix, call the model or database from your server only, and replace the key, because it may already have been copied.

  - id: browser-model-call
    files: code
    pattern: 'dangerouslyAllowBrowser\s*:\s*true'
    severity: critical
    control: BASE-2
    title: The AI model is called straight from the browser
    why: To call the model from the browser, the page must carry your model key, and patient text goes from the patient's device to the model company with nothing of yours in between to log or limit it.
    fix: Move the model call to a server route. The browser talks to your server; your server talks to the model.

  - id: tls-checks-off
    files: code
    pattern: 'verify\s*=\s*False|rejectUnauthorized\s*:\s*false|NODE_TLS_REJECT_UNAUTHORIZED[''"\]\s]*=\s*[''"]?0|InsecureSkipVerify\s*:\s*true|CURLOPT_SSL_VERIFYPEER\s*,\s*(?:false|0)'
    severity: high
    control: BASE-2
    title: Encryption checks are switched off
    why: With certificate checks off, the app will send patient data to anyone who pretends to be the server it meant to reach.
    fix: Remove the setting. If a certificate fails to verify, fix the certificate.

  - id: cors-wildcard
    files: code
    pattern: 'allow_origins\s*=\s*\[\s*[''"]\*[''"]|Access-Control-Allow-Origin[''"]?\s*[:,]\s*[''"]\*[''"]|\borigin\s*:\s*[''"]\*[''"]|\bcors\(\s*\)'
    severity: medium
    control: GATE-3
    title: Any website may call this app's API
    why: With every origin allowed, a page on another site can ask a signed-in user's browser to talk to your API.
    fix: List the exact web addresses that should be allowed to call the API.

  - id: tracker-session-replay
    files: code
    pattern: 'hotjar|fullstory|logrocket|clarity\.ms|connect\.facebook\.net|\bfbq\(|posthog|smartlook|mouseflow'
    severity: high
    control: TRUST-2
    title: A session recording or advertising tracker runs in this app
    why: These tools copy what is on the screen or what the visitor does to another company. On any page a patient uses, that is patient information leaving without an agreement.
    fix: Remove it from every page a patient or staff member uses once signed in, or get a signed Business Associate Agreement from that company and add it to your register.

  - id: tracker-analytics
    files: code
    pattern: 'googletagmanager|google-analytics|\bgtag\(|mixpanel|amplitude|@segment/|analytics\.js|@datadog/browser-rum|@vercel/analytics|plausible\.io'
    severity: medium
    control: TRUST-2
    title: A third-party analytics tool runs in this app
    why: Page addresses, search text and clicks can reveal that a person is a patient and what for. HHS treats that as patient information when it reaches a tracking company.
    fix: Keep it off signed-in and appointment pages, or get a signed Business Associate Agreement and add the company to your register.

  - id: error-reporting
    files: code
    pattern: '@sentry/|sentry_sdk|sentry\.init|bugsnag|rollbar'
    severity: low
    control: TRUST-2
    title: An error reporting service is in use
    why: Error reports often carry the data that was on screen or in the request when the error happened.
    fix: Turn off personal data in the reports (for example send_default_pii off, request bodies off), or get a signed Business Associate Agreement.

  - id: browser-storage
    files: code
    pattern: '(?:localStorage|sessionStorage)\.setItem\([^)]*(?:patient|diagnos|clinical|note|record|token|jwt)'
    severity: medium
    control: BASE-3
    title: Patient data or a login token is kept in the browser's storage
    why: Clinics share computers. What is stored this way stays after the tab is closed and can be read by any script on the page.
    fix: Keep sessions in a secure, HTTP-only cookie that expires, and keep patient data on the server.

  - id: audio-capture
    files: code
    pattern: 'getUserMedia|MediaRecorder|audio\.transcriptions|deepgram|assemblyai|speech_recognition|SpeechRecognition|whisper'
    severity: medium
    control: CONSENT-2
    title: This app records or transcribes audio
    why: In some states every person in a conversation must agree before it is recorded, and patients expect to be asked wherever they live.
    fix: Ask everyone before recording starts, save their answer, and let the visit go ahead without recording when someone says no.

# Lines that write to a log and mention something that sounds like patient data.
log_rule:
  id: patient-data-in-logs
  call: '(?:console\.(?:log|info|debug|warn|error)|\bprint|\blogg?(?:er|ing)?\.(?:debug|info|warn|warning|error|exception|log)|\bfmt\.Print\w*|\blog\.Print\w*)\s*\('
  words: '\b(?:patient|ssn|dob|date_?of_?birth|birth_?date|diagnos\w*|mrn|medical_?record|prescription|medication|insurance|clinical_?note|note_?text|transcript|symptom\w*|chart)\b'
  severity: medium
  control: MEM-5
  title: Patient details may be written to the logs
  why: Logs are copied to places with weaker protection and kept for a long time. A log line that contains patient data has to be protected like the record itself.
  fix: Log an ID, never the content. If you need the content to debug, use made-up test data.

# Secrets written into files. The matched text is never printed, only its first characters.
secret_rules:
  - {id: anthropic-key, pattern: 'sk-ant-[A-Za-z0-9_\-]{20,}', what: an Anthropic API key}
  - {id: openai-key, pattern: 'sk-(?:proj-|svcacct-)?[A-Za-z0-9_\-]{32,}', what: a model API key}
  - {id: aws-key, pattern: '\bAKIA[0-9A-Z]{16}\b', what: an AWS access key}
  - {id: google-key, pattern: '\bAIza[0-9A-Za-z_\-]{35}\b', what: a Google API key}
  - {id: github-token, pattern: '\bgh[pousr]_[A-Za-z0-9]{36,}\b', what: a GitHub token}
  - {id: slack-token, pattern: '\bxox[abpr]-[A-Za-z0-9\-]{10,}', what: a Slack token}
  - {id: stripe-key, pattern: '\b[sr]k_live_[0-9a-zA-Z]{24,}', what: a live Stripe key}
  - {id: private-key, pattern: '-----BEGIN (?:RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY', what: a private key}
secret:
  severity: critical
  control: BASE-2
  title: A secret key is written into the code
  why: Anyone who can see the code, including every tool and service that reads the repository, can use the key.
  fix: Replace the key now, because once it has been committed it should be treated as leaked. Then load the new one from an environment variable or a secret manager.
service_role:
  severity: critical
  control: GATE-3
  title: A database admin key (Supabase service role) is written into the code
  why: This key ignores every row level security rule. Whoever holds it can read every patient's rows.
  fix: Replace the key in the Supabase dashboard now, and use it only on the server, loaded from a secret.
env_file:
  severity: critical
  control: BASE-2
  title: A file of secrets (.env) is part of the repository
  why: Everyone with access to the repository, now or later, has every key in the file.
  fix: Replace each key in it, remove the file from the repository, and add .env to .gitignore.

# Companies that receive whatever the app sends to its AI model. `pattern` finds the SDK or the host in code.
providers:
  - {name: OpenAI, host: api.openai.com, pattern: 'api\.openai\.com|from\s+openai\b|import\s+openai\b|[''"]openai[''"]|@ai-sdk/openai|langchain_openai'}
  - {name: Anthropic, host: api.anthropic.com, pattern: 'api\.anthropic\.com|from\s+anthropic\b|import\s+anthropic\b|@anthropic-ai/sdk|@ai-sdk/anthropic|langchain_anthropic'}
  - {name: Google Gemini, host: generativelanguage.googleapis.com, pattern: 'generativelanguage\.googleapis\.com|google\.generativeai|@google/generative-ai|@google/genai|google\.genai|@ai-sdk/google'}
  - {name: Groq, host: api.groq.com, pattern: 'api\.groq\.com|groq-sdk|from\s+groq\b|import\s+groq\b'}
  - {name: Mistral, host: api.mistral.ai, pattern: 'api\.mistral\.ai|@mistralai/|from\s+mistralai\b'}
  - {name: Cohere, host: api.cohere.com, pattern: 'api\.cohere\.(?:com|ai)|cohere-ai|from\s+cohere\b|import\s+cohere\b'}
  - {name: Together AI, host: api.together.xyz, pattern: 'api\.together\.(?:xyz|ai)|together-ai|from\s+together\b'}
  - {name: OpenRouter, host: openrouter.ai, pattern: 'openrouter\.ai|@openrouter/'}
  - {name: DeepSeek, host: api.deepseek.com, pattern: 'api\.deepseek\.com'}
  - {name: xAI, host: api.x.ai, pattern: 'api\.x\.ai'}
  - {name: Perplexity, host: api.perplexity.ai, pattern: 'api\.perplexity\.ai'}
  - {name: Replicate, host: api.replicate.com, pattern: 'api\.replicate\.com|from\s+replicate\b|import\s+replicate\b|[''"]replicate[''"]'}
  - {name: Hugging Face Inference, host: api-inference.huggingface.co, pattern: 'api-inference\.huggingface\.co|@huggingface/inference|InferenceClient'}
  - {name: ElevenLabs, host: api.elevenlabs.io, pattern: 'api\.elevenlabs\.io|elevenlabs'}
  - {name: Deepgram, host: api.deepgram.com, pattern: 'api\.deepgram\.com|@deepgram/sdk'}
  - {name: AssemblyAI, host: api.assemblyai.com, pattern: 'api\.assemblyai\.com|assemblyai'}
provider:
  control: TRUST-1
  unlisted:
    severity: high
    title: 'Patient data can reach {name}, and nothing on file says an agreement covers it'
    why: Whatever the app sends to its AI model is received by this company. Without a signed Business Associate Agreement with them, sending real patient data is a HIPAA violation, however good the code is.
    fix: 'Sign a Business Associate Agreement with {name} (or use a provider that will sign one), then list {host} in register.yaml with baa: true, training_on_phi: prohibited and a retention period. Until then, use made-up data only.'
  problem:
    severity: high
    title: '{name} is in your register, but the entry is not good enough: {problems}'
    why: The register is your own record of who may receive patient data. This entry says the conditions are not met.
    fix: 'Fix what the entry says is missing for {host}, or stop sending patient data to {name}.'

# What `pz check` cannot see. Printed after every run so a clean result is not mistaken for a pass.
blind_spots:
  - whether a signed-in user can open another patient's or another clinic's records (run `pz probe isolation` against a test copy)
  - whether the AI can be talked into leaking or sending data (run `pz probe agent`)
  - whether login, multi-factor sign-in, backups and the audit log work
  - whether patients are told about the AI and can say no
  - anything set in a hosting dashboard and not written in this folder
